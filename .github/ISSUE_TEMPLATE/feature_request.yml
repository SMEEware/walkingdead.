name: Feature request
description: Propose an improvement to Walking Dead.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the task you need to accomplish and what currently gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how the feature would work for an operator.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and context
      description: Optional workarounds, alternatives, or deployment constraints.
