name: Bug report
description: Report a reproducible problem.
body:
  - type: markdown
    attributes:
      value: |
        For vulnerabilities, use a private GitHub security advisory instead of a public issue.
        Remove keys, credentials, captured traffic, and identifying data from public reports.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the affected page or command and a minimal configuration.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the commit or version, operating system, architecture, and browser or runtime versions involved.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Optional sanitized logs, errors, or screenshots.
