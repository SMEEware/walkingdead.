name: Release
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [".github/workflows/release.yml", ".github/release-notes.md"]
permissions:
  contents: write
concurrency:
  group: release
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Select release tag
        id: tag
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; else tag="$(git describe --tags --abbrev=0 --match 'v*')"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; fi
      - name: Build release archives
        if: steps.tag.outputs.exists != 'true'
        run: |
          version="${{ steps.tag.outputs.tag }}"
          version="${version#v}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            ./build.sh --version "$version" --target "$target" || ./build.sh --version "$version" --target "$target"
          done
          (cd dist && sha256sum walkingdead-*.tar.gz walkingdead-*.zip > SHA256SUMS.txt)
      - name: Publish GitHub release
        if: steps.tag.outputs.exists != 'true'
        run: |
          tag="${{ steps.tag.outputs.tag }}"
          gh release create "$tag" dist/walkingdead-*.tar.gz dist/walkingdead-*.zip dist/SHA256SUMS.txt \
            --verify-tag --title "Walking Dead ${tag#v}" --notes-file .github/release-notes.md
